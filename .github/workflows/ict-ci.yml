name: ICT Comprehensive CI

on:
  pull_request:
    branches: [phase-1-local-mvp]
  push:
    branches: [feature/ict-comprehensive]

permissions:
  contents: read

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, curl, dom, fileinfo, mbstring, pdo_sqlite, sqlite3, xml
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: PHP syntax check
        run: |
          find app tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run Laravel test suite
        run: php artisan test
